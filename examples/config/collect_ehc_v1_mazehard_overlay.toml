# Legacy-only fallback: collect a persisted figure bundle from an EHC v1
# MazeHard artifact.
#
# This path is not part of the supported EHC report workflow.
# Standard workflow: enable eval_regimes during training, then run
# render_report_figures.py with examples/config/render_ehc_v1_mazehard_overlay.toml
# against a callback-produced logs/.../eval_regimes/... event directory.
#
# Notes:
# - artifact.executor_config_path must point to the training config used by the
#   executor family.
# - artifact.checkpoint_path must point to a weights-only executor checkpoint
#   from the same run (not a full trainer-resume .ckpt).
# - run_dir is where manifest.json and cases/*.dense.npz will be written.

provider_ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayProvider"
run_dir = "outputs/examples/ehc_v1_mazehard_overlay_bundle"

regime_id = "mazehard_overlay_demo"
regime_kind = "diagnostic"
max_batches = 8

# Let the collector infer the required trace keys from the requested figure.
figures = ["overlay"]

trigger_kind = "manual"
epoch = 0
step = 0

[artifact]
schema_version = "1"
artifact_type = "evaluation_executor"
model_family = "ehc-v1"
executor_config_path = "examples/config/training.ehc-v1-reason-512.toml"
checkpoint_path = "checkpoints/ehc-v1-reason/eval-weights-only.pt"
checkpoint_format = "weights_only"

[provider_settings]
dataset_path = "data/processed/mazehard/default/v1"
split = "val"
batch_size = 1
n_cases = 8
