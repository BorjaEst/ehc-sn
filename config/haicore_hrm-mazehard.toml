# =============================================================================
# HRM v1 Baseline — Default Configuration
# =============================================================================
# Override any value via CLI:  --model.pfc.cortex.embedding_dim=256
# Or via env var:              HRM_V1_CONFIGURATION_PATH=config/my_config.toml

# -- Dataset & training -------------------------------------------------------
dataset_path       = "data/processed/maze-30x30-hard-1k"
global_batch_size  = 128
epochs             = 100
seed               = 42
augment            = true
val_check_interval = 100

# -- Model architecture -------------------------------------------------------
[model]
    vocab_size = 6 # 5 canonical SEM IDs + O_ID (solution-path token)

[model.pfc]
    seq_length = 900 # 30 × 30 for mazehard puzzle

[model.pfc.reasoning_h] # High-level reasoning (anterior dlPFC) — legacy parity: 4 layers × 2 cycles, 512-d, 8 heads, RoPE
    cortex.embedding_dim = 512
    cortex.num_heads     = 8
    cortex.pos_encodings = "rope"
    cortex.rope_theta    = 10000.0
    n_layers             = 4
    n_cycles             = 2

[model.pfc.reasoning_l] # Low-level reasoning (posterior dlPFC) — must match reasoning_h embedding_dim
    cortex.embedding_dim = 512
    cortex.num_heads     = 8
    cortex.pos_encodings = "rope"
    cortex.rope_theta    = 10000.0
    n_layers             = 4
    n_cycles             = 2

[model.pfc.value_head]
    hidden_size = 512 # Should match the PFC reasoning module's embedding_dim
    n_actions   = 2
    pool_index  = 0 # Reads the CLS summary slot (position 0), not a maze cell
    init_bias   = -5.0

# -- ACT controller -----------------------------------------------------------
[act_controller]
    exploration_prob = 0.1
    max_steps        = 16

# -- Loss, optimizer, scheduler (defaults are fine; override here if needed) ---
[loss]
    function = "stablemax_cross_entropy"

[optimizer]
    lr           = 1e-4
    weight_decay = 0.1
    betas        = [0.9, 0.95]

[scheduler]
    warmup_steps = 2000
    min_ratio    = 1.00
