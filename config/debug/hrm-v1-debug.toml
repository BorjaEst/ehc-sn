# =============================================================================
# Metadata (comments only)
# class: training
# id: hrm-v1-debug
# role: entrypoint debug defaults for HRM v1 diagnostics and replay checks
# =============================================================================
# Override any value via CLI:  --model.pfc.cortex.embedding_dim=256
# Or via env var:              HRM_V1_CONFIGURATION_PATH=config/my_config.toml

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/hrm-v1-base.toml"

# -- Dataset & training -------------------------------------------------------
dataset_path         = "data/processed/mazehard/default/v1"
global_batch_size    = 4
max_epochs           = 1
max_steps            = 32
seed                 = 42
augment              = true
num_workers          = 0
pin_memory           = false
persistent_workers   = false
log_every_n_steps    = 1
val_check_interval   = 8
limit_val_batches    = 1
enable_progress_bar  = false
trainer_accelerator  = "auto"
trainer_strategy     = "auto"
trainer_devices      = 1
trainer_num_nodes    = 1
trainer_precision    = "16-mixed"
diagnostic_level     = "standard"
non_finite_policy    = "raise"
init_weights_groups  = ["all"]

# -- Adapter settings ---------------------------------------------------------
[adapter]
    encoder_kind = "rope"  # "learned" or "rope"
    vocab_size = 6  # 5 canonical SEM IDs + O_ID (solution-path token)

# -- ACT controller -----------------------------------------------------------
[controller]
    max_halt_steps = 16
    exploration_prob = 0.1

# -- Objective, optimizer, scheduler ------------------------------------------
[objective]
    token_loss = "stablemax_cross_entropy"

[optimizer]
    lr           = 1e-4
    weight_decay = 0.1
    betas        = [0.9, 0.95]

[scheduler]
    warmup_steps = 2000
    min_ratio    = 1.00

[runtime.validation]
    max_rollout_steps = 16

# -- Logs and checkpoints -----------------------------------------------------
[logger]
    save_dir  = "logs"
    name      = "hrm-v1-debug"
    log_graph = false
    prefix    = ""

[lr_monitor]
    logging_interval = "step"
    log_weight_decay = false
    log_momentum = false

[checkpoint]
    dirpath                 = "checkpoints/hrm-v1-debug"
    filename                = "hrm-v1-{step:08d}"
    save_top_k              = -1
    every_n_train_steps     = 100
    save_on_train_epoch_end = false
    save_last               = true
    save_on_exception       = true
    save_weights_only       = false

# -- Standalone scheduled figure generation -----------------------------------
[figures]
enabled    = false
context    = "validation"
every_n_epochs = 5
every_n_steps  = 0
figures    = ["halting_timeline", "value_evolution"]
max_cases  = 2
save_pdf   = true
save_png   = false
png_dpi    = 160
max_items  = 4
max_cells  = 16
max_retained_files = 200
failure_policy = "warn"

# -- Named evaluation regimes -------------------------------------------------
[[eval_regimes.regimes]]
task         = "maze_hard"
regime_id    = "maze_val_diag"
regime_kind  = "diagnostic"
provider_ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayProvider"

[eval_regimes.regimes.provider_settings]
dataset_path = "data/processed/mazehard/default/v1"
split        = "val"
batch_size   = 1
n_cases      = 4

[eval_regimes.regimes.schedule]
every_n_epochs = 0
every_n_steps  = 8
max_batches    = 4

[eval_regimes.regimes.trace_request]
enabled    = true
trace_keys = ["value/q_logits"]