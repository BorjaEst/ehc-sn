dataset_path      = "data/processed/maze-30x30-hard-1k"
global_batch_size = 16
epochs            = 100
seed              = 42
augment           = true

warmup_steps = 5000


# -- Environment settings ----------------------------------------------------------------------
[environment]
    max_steps   = 16
    seq_length  = 900
    vocab_size  = 6
    halt_action = 0

# -- Model settings -------------------------------------------------------------------------------
[model]
    vocab_size = 6 # 5 canonical SEM IDs + O_ID (solution-path token)

[model.pfc]
    seq_length             = 900 # 30 × 30 for mazehard puzzle
    value_head.hidden_size = 512 # Should match the PFC reasoning module's embedding_dim
    value_head.n_actions   = 2
    value_head.pool_mode   = "first"
    value_head.pool_index  = 0 # Reads the CLS summary slot (position 0), not a maze cell
    value_head.init_bias   = -5.0
    cortex.embedding_dim   = 512
    cortex.num_heads       = 8
    cortex.pos_encodings   = "rope"
    cortex.rope_theta      = 10000.0
    layers_h               = 4
    cycles_h               = 2
    layers_l               = 4
    cycles_l               = 2

# STR actor-critic: gamma is basal-ganglia temporal credit assignment
[model.str]
    n_features = 512  # cortical features, same as pfc.reasoning_i.cortex.embedding_dim
    n_actions  = 2    # Halt and continue


# -- Optimizer and scheduler settings -------------------------------------------------------
[optimizer_supervised]
    lr           = 1e-4
    weight_decay = 1e-2

[optimizer_rl]
    lr           = 1e-4
    weight_decay = 0.0

[optimizer_qv]
    lr           = 1e-4
    weight_decay = 0.0

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

# -- Loss settings --------------------------------------------------------------------------------
[loss]
    function    = "stablemax_cross_entropy"
    c_actor     = 1.0
    c_critic    = 0.5
    c_entropy   = 0.01
    c_q_value   = 0.5

[rl_controller]
    exploration_prob = 0.1
