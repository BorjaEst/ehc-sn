dataset_path      = "data/processed/maze-30x30-hard-1k"
global_batch_size = 16
epochs            = 100
seed              = 42
augment           = true

warmup_steps = 5000


# -- Environment settings ----------------------------------------------------------------------
[environment]
    max_steps   = 16
    seq_length  = 900
    vocab_size  = 6
    halt_action = 0

# -- Model settings -------------------------------------------------------------------------------
[model]
    vocab_size = 6

[model.pfc]
    seq_length = 900

[model.pfc.reasoning_h]
    cortex.embedding_dim = 512
    cortex.num_heads     = 4

[model.pfc.reasoning_l]
    cortex.embedding_dim = 512
    cortex.num_heads     = 4

# vmPFC (QValueEstimator): auxiliary Q-predictor trained with a separate TD loss.
[model.pfc.value_head]
    pool_mode   = "first_detached"  # detach reward error propagation to reasoning
    hidden_size = 512
    n_actions   = 2
    pool_index  = 0
    init_bias   = -5.0

# STR actor-critic: gamma is basal-ganglia temporal credit assignment
[model.str]
    n_features = 512  # cortical features, same as pfc.reasoning_i.cortex.embedding_dim
    n_actions  = 2    # Halt and continue


# -- Optimizer and scheduler settings -------------------------------------------------------
[optimizer_supervised]
    lr           = 1e-4
    weight_decay = 1e-2

[optimizer_rl]
    lr           = 1e-4
    weight_decay = 0.0

[optimizer_qv]
    lr           = 1e-4
    weight_decay = 0.0

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

# -- Loss settings --------------------------------------------------------------------------------
[loss]
    function    = "stablemax_cross_entropy"
    c_actor     = 1.0
    c_critic    = 0.5
    c_entropy   = 0.01
    c_q_value   = 0.5

[rl_controller]
    exploration_prob = 0.1
