# =============================================================================
# HRM v1 Baseline — Default Configuration
# =============================================================================
# Override any value via CLI:  --model.pfc.cortex.embedding_dim=256
# Or via env var:              HRM_V1_CONFIGURATION_PATH=config/my_config.toml

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/hrm-v1.toml"

# -- Dataset & training -------------------------------------------------------
dataset_path      = "data/processed/mazehard/default/v1"
global_batch_size = 16
max_epochs        = 100
seed              = 42
augment           = true
val_check_interval = 1000

# -- Adapter settings ---------------------------------------------------------
[adapter]
    encoder_kind = "rope"  # "learned" or "rope"
    vocab_size = 6  # 5 canonical SEM IDs + O_ID (solution-path token)

# -- ACT controller -----------------------------------------------------------
[controller]
    exploration_prob = 0.1
    max_steps        = 16

# -- Objective, optimizer, scheduler (defaults are fine; override here if needed) ---
[objective]
    function = "stablemax_cross_entropy"

[optimizer]
    lr           = 1e-4
    weight_decay = 0.1
    betas        = [0.9, 0.95]

[scheduler]
    warmup_steps = 2000
    min_ratio    = 1.00

[runtime.validation]
    hard_max_rollout_steps = 16

# -- Figures & diagnostics ----------------------------------------------------
[logger]
    save_dir  = "logs"
    name      = "hrm-v1"
    log_graph = false
    prefix    = ""

[checkpoint]
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true

[figures]
    enabled = true
    figures = ["overlay", "evolution"]

# -- Named evaluation regimes -------------------------------------------------
# Uncomment and configure to enable out-of-band diagnostic regime runs.
# Regimes log under diag/<regime_id>/ and never touch val/.
# Provide a task-owned EvaluationSourceProvider implementation as provider_ref.

[[eval_regimes.regimes]]
regime_id    = "maze_val_diag"
phase_kind   = "diag"
provider_ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayDiagnosticProvider"

[eval_regimes.regimes.provider_settings]
dataset_path = "data/processed/mazehard/default/v1"
split        = "val"
batch_size   = 1
n_cases      = 0

[eval_regimes.regimes.schedule]
every_n_epochs = 5
every_n_steps  = 0
max_batches    = 10

[eval_regimes.regimes.trace_request]
enabled    = false
trace_keys = []
