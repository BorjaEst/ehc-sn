# =============================================================================
# HRM v1 Baseline — Default Configuration
# =============================================================================
# Override any value via CLI:  --model.pfc.cortex.embedding_dim=256
# Or via env var:              HRM_V1_CONFIGURATION_PATH=config/my_config.toml

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/hrm-v1.toml"

# -- Dataset & training -------------------------------------------------------
dataset_path      = "data/processed/maze-30x30-hard-1k"
global_batch_size = 16
epochs            = 100
seed              = 42
augment           = true
val_check_interval = 1000

# -- ACT controller -----------------------------------------------------------
[act_controller]
    exploration_prob = 0.1
    max_steps        = 16

# -- Loss, optimizer, scheduler (defaults are fine; override here if needed) ---
[loss]
    function = "stablemax_cross_entropy"

[optimizer]
    lr           = 1e-4
    weight_decay = 0.1
    betas        = [0.9, 0.95]

[scheduler]
    warmup_steps = 2000
    min_ratio    = 1.00

[logger]
    save_dir  = "logs"
    name      = "hrm-v1"
    log_graph = false
    prefix    = ""

[checkpoint]
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true

# -- Figures & diagnostics ----------------------------------------------------
[figures]
    enabled = true
    figures = ["overlay", "evolution"]
