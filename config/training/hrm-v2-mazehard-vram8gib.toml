# Training config — MazeHard × HRM-v2 (nested experiment schema)
# =============================================================================

[model]
    model_config_path = "config/models/hrm-v2-base.toml"

[model.components.adapter]
    encoder_kind = "rope"
    vocab_size   = 6

[model.components.objective]
    token_loss      = "stablemax_cross_entropy"
    c_state_value   = 0.5
    c_q_value       = 0.5

[execution]
    halt_action     = 0
    episode_horizon = 16

[training.optimizer_supervised]
    lr           = 1e-4
    weight_decay = 1e-2

[training.optimizer_rl]
    lr           = 1e-4
    weight_decay = 0.0

[training.optimizer_qv]
    lr           = 1e-4
    weight_decay = 0.0

[training.reward]
    success_reward         = 1.0
    continue_cost          = -0.01
    incorrect_halt_penalty = -1.0
    truncation_penalty     = -1.0

training.halt_disabled_steps = 5000

[training.scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

[execution.validation]
    max_rollout_steps = 16

[data]
    dataset_path         = "data/processed/mazehard/default/v1"
    num_slots            = 100
    eval_batch_size      = 100
    num_workers          = 4
    prefetch_factor      = 2
    pin_memory           = true
    persistent_workers   = true
    augment              = true
    seed                 = 42

[trainer]
    accelerator         = "gpu"
    strategy            = "ddp"
    devices             = 1
    num_nodes           = 1
    precision           = "16-mixed"
    max_steps           = 50000
    val_check_interval  = 1000
    log_every_n_steps   = 10
    enable_progress_bar = true
    limit_val_batches   = 1.0
    seed                = 42

[checkpointing]
    init_weights_groups          = ["all"]
    diagnostic_level             = "standard"
    non_finite_policy            = "raise"

[checkpointing.checkpoint]
    dirpath             = "checkpoints/hrm-v2-mazehard"
    filename            = "{step:06d}"
    every_n_train_steps = 1000
    save_last           = true
    save_on_exception   = true

[logging]
    save_dir  = "logs"
    name      = "hrm-v2-mazehard"
    log_graph = false
    prefix    = ""
