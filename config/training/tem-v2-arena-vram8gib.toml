# Training config — Arena × TEM-v2 (nested experiment schema)
# =============================================================================

[model]
    model_config_path = "config/models/tem-v2-base.toml"

[model.components.adapter]
    observation_dim = 45
    action_count    = 5

[model.components.adapter.encoder]
    kind   = "two_hot"
    layout = "replicated"

[model.components.adapter.decoder]
    kind            = "single_scale"
    prediction_freq = 0

[model.components.controller]
    window_size = 2000

[model.components.objective]
    observation_loss = "softmax_cross_entropy"
    c_obs            = 1.0
    c_grid           = 1.0
    c_place          = 1.0
    c_grid_reg       = 0.01
    c_place_reg      = 0.02
    grid_reg_norm    = "l2"
    place_reg_norm   = "l1"
    temp_it          = 2000
    p2g_use_it       = 0.0
    p2g_scale        = 200.0
    g_reg_it         = 40000000
    p_reg_it         = 4000

[training.optimizer]
    lr           = 9.4e-4
    weight_decay = 0.00
    betas        = [0.9, 0.98]

[execution.memory]
    eta           = 0.5
    eta_it        = 16000
    hebbian_decay = 0.9999
    lambda_it     = 200

[execution.uncertainty]
    p2g_sig_half_it  = 0
    p2g_sig_scale_it = 200
    offset_min       = 0.0
    offset_max       = 10000.0

[execution.sequence]
    tbptt_steps = 25

[execution.validation]
    hard_max_rollout_steps = 6000
    max_rollout_steps      = 250
    seed                   = 42

[data]
    dataset_path         = "data/processed/arena/default/v1"
    num_slots            = 40
    eval_batch_size      = 32
    num_workers          = 4
    prefetch_factor      = 2
    pin_memory           = true
    persistent_workers   = true
    augment              = true
    seed                 = 42

[trainer]
    accelerator         = "gpu"
    strategy            = "ddp"
    devices             = 1
    num_nodes           = 1
    precision           = "bf16-mixed"
    max_steps           = 50000
    val_check_interval  = 1000
    log_every_n_steps   = 10
    enable_progress_bar = true
    limit_val_batches   = 10
    seed                = 42
    find_unused_parameters = true

[checkpointing]
    init_weights_groups = ["all"]
    diagnostic_level    = "standard"
    non_finite_policy   = "raise"

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

[logging]
    save_dir  = "logs"
    name      = "tem-v2-arena"
    log_graph = false
    prefix    = ""
