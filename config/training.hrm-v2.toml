# =============================================================================
# HRM v2 Deliberation Actor-Critic — Default Configuration
# =============================================================================

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/hrm-v2.toml"

# -- Dataset & training -------------------------------------------------------
dataset_path       = "data/processed/mazehard/default/v1"
global_batch_size  = 16
max_epochs         = 100
seed               = 42
augment            = true
val_check_interval = 1000
supervised_only_warmup_steps = 5000

# -- Adapter settings ---------------------------------------------------------
[adapter]
    encoder_kind = "rope"  # "learned" or "rope"
    vocab_size = 6  # 5 canonical SEM IDs + O_ID (solution-path token)

# -- Deliberation AC controller -----------------------------------------------
[controller]

# -- Deliberation capability config ------------------------------------------
[deliberation]
    halt_action      = 0
    episode_horizon  = 16

# -- Objective, optimizer, scheduler (defaults are fine; override here if needed) ---
[objective]
    function  = "stablemax_cross_entropy"
    c_actor   = 1.0
    c_critic  = 0.5
    c_entropy = 0.01
    c_q_value = 0.5

[optimizer_supervised]
    lr           = 1e-4
    weight_decay = 1e-2

[optimizer_rl]
    lr           = 1e-4
    weight_decay = 0.0

[optimizer_qv]
    lr           = 1e-4
    weight_decay = 0.0

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

[runtime.validation]
    hard_max_rollout_steps = 16

# -- Figures & diagnostics ----------------------------------------------------
[logger]
    save_dir  = "logs"
    name      = "hrm-v2"
    log_graph = false
    prefix    = ""

[checkpoint]
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true

[figures]
    enabled = true
    figures = ["overlay", "evolution"]

# -- Named evaluation regimes -------------------------------------------------
# Uncomment and configure to enable out-of-band diagnostic regime runs.
# Regimes log under diag/<regime_id>/ and never touch val/.
# Provide a task-owned EvaluationSourceProvider implementation as provider_ref.

[[eval_regimes.regimes]]
regime_id    = "maze_val_diag"
phase_kind   = "diag"
provider_ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayDiagnosticProvider"

[eval_regimes.regimes.provider_settings]
dataset_path = "data/processed/mazehard/default/v1"
split        = "val"
batch_size   = 1
n_cases      = 0

[eval_regimes.regimes.schedule]
every_n_epochs = 5
every_n_steps  = 0
max_batches    = 10

[eval_regimes.regimes.trace_request]
enabled    = false
trace_keys = []
