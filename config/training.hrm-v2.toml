# =============================================================================
# HRM v2 RL-Striatum — Default Configuration
# =============================================================================

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/hrm-v2.toml"



# -- Dataset & training -------------------------------------------------------
dataset_path       = "data/processed/mazehard"
global_batch_size  = 16
max_epochs         = 100
seed               = 42
augment            = true
val_check_interval = 1000
supervised_only_warmup_steps = 5000

# -- Adapter settings ---------------------------------------------------------
[adapter]
    encoder_kind = "rope"  # "learned" or "rope"
    vocab_size = 6  # 5 canonical SEM IDs + O_ID (solution-path token)

# -- Environment --------------------------------------------------------------
[environment]
    max_episode_steps = 16
    seq_length  = 900
    vocab_size  = 6
    halt_action = 0

# -- Optimization -------------------------------------------------------------
[optimizer_supervised]
    lr           = 1e-4
    weight_decay = 1e-2

[optimizer_rl]
    lr           = 1e-4
    weight_decay = 0.0

[optimizer_qv]
    lr           = 1e-4
    weight_decay = 0.0

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

[runtime.validation]
    hard_max_rollout_steps = 16

# -- Controller & objective ---------------------------------------------------
[controller]
    policy.exploration_prob = 0.1

[objective]
    function  = "stablemax_cross_entropy"
    c_actor   = 1.0
    c_critic  = 0.5
    c_entropy = 0.01
    c_q_value = 0.5

[logger]
    save_dir  = "logs"
    name      = "hrm-v2"
    log_graph = false
    prefix    = ""

[checkpoint]
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true

[figures]
    enabled = true
    figures = ["overlay", "evolution"]
