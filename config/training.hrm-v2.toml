# =============================================================================
# HRM v2 Deliberation Actor-Critic — Default Configuration
# =============================================================================

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/hrm-v2.toml"

# -- Dataset & training -------------------------------------------------------
dataset_path       = "data/processed/mazehard/default/v1"
global_batch_size  = 16
max_epochs         = 100
seed               = 42
augment            = true
val_check_interval = 1000
supervised_only_warmup_steps = 5000

# -- Adapter settings ---------------------------------------------------------
[adapter]
    encoder_kind = "rope"  # "learned" or "rope"
    vocab_size = 6  # 5 canonical SEM IDs + O_ID (solution-path token)

# -- Deliberation AC controller -----------------------------------------------
[controller]

# -- Deliberation capability config ------------------------------------------
[deliberation]
    halt_action      = 0
    episode_horizon  = 16

# -- Reward config ------------------------------------------------------------
[reward]
    success_reward = 1.0
    continue_cost = -0.01
    incorrect_halt_penalty = -1.0
    truncation_penalty = -1.0

# -- Objective, optimizer, scheduler ------------------------------------------
[objective]
    token_loss  = "stablemax_cross_entropy"
    c_state_value = 0.5
    c_q_value = 0.5

[optimizer_supervised]
    lr           = 1e-4
    weight_decay = 1e-2

[optimizer_rl]
    lr           = 1e-4
    weight_decay = 0.0

[optimizer_qv]
    lr           = 1e-4
    weight_decay = 0.0

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

[runtime.validation]
    max_rollout_steps = 16

# -- Logs and checkpoints -----------------------------------------------------
[logger]
    save_dir  = "logs"
    name      = "hrm-v2"
    log_graph = false
    prefix    = ""

[checkpoint]
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true
