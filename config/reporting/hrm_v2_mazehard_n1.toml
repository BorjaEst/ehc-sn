schema_version = "ehc_sn.reporting.report_spec.v1"
model_family = "hrm-v2"
eval_artifacts_root = "artifacts/evaluation/hrm_v2"
output_dir = "artifacts/reports/hrm_v2/mazehard_n1"

[checkpoint]
path = "models/hrm-v2/best.pt"

[[regimes]]
task = "mazehard"
regime_kind = "diagnostic"
regime_ids = ["mazehard_n1"]

[figures]
figures = [
    "task_overview_mazehard",
    "mazehard_prediction_evolution",
    "pfc_latent_dynamics",
    "h_l_residuals_over_steps",
    "prediction_accuracy_over_steps",
    "halting_timeline",
    # "q_value_evolution",  # requires value/q_values trace
    # "pfc_path_memory_probe",  # requires separate probe evaluation
]
formats = ["png", "pdf"]

[render]
formats = ["markdown"]
