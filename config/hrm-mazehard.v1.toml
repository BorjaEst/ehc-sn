# =============================================================================
# HRM v1 Baseline — Default Configuration
# =============================================================================
# Override any value via CLI:  --model.pfc.cortex.embedding_dim=256
# Or via env var:              HRM_V1_CONFIGURATION_PATH=config/my_config.toml

# -- Dataset & training -------------------------------------------------------
dataset_path      = "data/processed/maze-30x30-hard-1k"
global_batch_size = 16
epochs            = 100
seed              = 42
augment           = true
val_check_interval = 1000

# -- Model architecture -------------------------------------------------------
[model]
    vocab_size = 6 # 5 canonical SEM IDs + O_ID (solution-path token)

[model.pfc]
    seq_length             = 900 # 30 × 30 for mazehard puzzle
    value_head.hidden_size = 512 # Should match the PFC reasoning module's embedding_dim
    value_head.n_actions   = 2
    value_head.pool_mode   = "first"
    value_head.pool_index  = 0 # Reads the CLS summary slot (position 0), not a maze cell
    value_head.init_bias   = -5.0
    cortex.embedding_dim   = 512
    cortex.num_heads       = 8
    cortex.pos_encodings   = "rope"
    cortex.rope_theta      = 10000.0
    layers_h               = 4
    cycles_h               = 2
    layers_l               = 4
    cycles_l               = 2

# -- ACT controller -----------------------------------------------------------
[act_controller]
    exploration_prob = 0.1
    max_steps        = 16

# -- Loss, optimizer, scheduler (defaults are fine; override here if needed) ---
[loss]
    function = "stablemax_cross_entropy"

[optimizer]
    lr           = 1e-4
    weight_decay = 0.1
    betas        = [0.9, 0.95]

[scheduler]
    warmup_steps = 2000
    min_ratio    = 1.00

# -- Figures & diagnostics ----------------------------------------------------
[figures]
    enabled = true
    figures = ["overlay", "evolution"]
