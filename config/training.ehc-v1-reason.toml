# =============================================================================
# EHC v1 MazeHard Reason Baseline — Default Smoke Configuration
# =============================================================================

# -- Model architecture -------------------------------------------------------
model_config_path = "config/models/ehc-v1-mazehard.toml"

# -- Dataset & training -------------------------------------------------------
mode                          = "reason_pretrain"
dataset_path                  = "data/processed/mazehard/default/v1"
global_batch_size             = 10
max_epochs                    = 100
seed                          = 42
augment                       = true
num_workers                   = 4
prefetch_factor               = 2
pin_memory                    = true
persistent_workers            = true
max_steps                     = 200000
log_every_n_steps             = 10
val_check_interval            = 1000
limit_val_batches             = 10
enable_progress_bar           = true
trainer_accelerator           = "gpu"
trainer_strategy              = "ddp"
trainer_devices               = 1
trainer_num_nodes             = 1
trainer_precision             = "16-mixed"
diagnostic_level              = "standard"
supervised_only_warmup_steps  = 5000

# -- Adapter settings ---------------------------------------------------------
[adapter]
    vocab_size = 6

# -- Deliberation actor-critic controller -------------------------------------
[controller]

# -- Deliberation capability config -------------------------------------------
[deliberation]
    halt_action     = 0
    episode_horizon = 16

# -- Objective ----------------------------------------------------------------
[objective]
    token_loss  = "stablemax_cross_entropy"
    gamma     = 0.99
    c_state_value = 0.5
    c_q_value = 0.5

# -- Optimizers & scheduler ---------------------------------------------------
[optimizer_ctrl]
    lr           = 3e-4
    weight_decay = 0.01
    betas        = [0.9, 0.98]

[optimizer_heads]
    lr           = 3e-4
    weight_decay = 0.01
    betas        = [0.9, 0.98]

[scheduler]
    warmup_steps = 5000
    min_ratio    = 0.01

# -- Runtime ------------------------------------------------------------------
[runtime.validation]
    max_rollout_steps      = 32
    hard_max_rollout_steps = 64

# -- Figures & diagnostics ----------------------------------------------------
[logger]
    save_dir  = "logs"
    name      = "ehc-v1-reason"
    log_graph = false
    prefix    = ""

[lr_monitor]
    logging_interval = "step"
    log_weight_decay = false
    log_momentum = false

[checkpoint]
    dirpath                 = "checkpoints/ehc-v1-reason"
    filename                = "epoch={epoch:03d}"
    save_top_k              = 0
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true
    save_on_exception       = true
    save_weights_only       = false

# -- Named evaluation regimes -------------------------------------------------
# Out-of-band diagnostic regime runs.
# Regimes log under diagnostic/<regime_id>/ and never touch val/.
# Provider classes are task-owned.

[[eval_regimes.regimes]]
regime_id    = "maze_val_diag"
regime_kind  = "diagnostic"
provider_ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayProvider"

[eval_regimes.regimes.provider_settings]
dataset_path = "data/processed/mazehard/default/v1"
split        = "val"
batch_size   = 1
n_cases      = 0

[eval_regimes.regimes.schedule]
every_n_epochs = 5
every_n_steps  = 0
max_batches    = 10

[eval_regimes.regimes.trace_request]
enabled    = false
trace_keys = []