# -- General settings -----------------------------------------------------------------------------
dataset_path      = "data/processed/dungeons"
global_batch_size = 16
epochs            = 100
seed              = 42
augment           = true

num_workers        = 4
prefetch_factor    = 2
pin_memory         = true
persistent_workers = true

max_steps           = 200000
log_every_n_steps   = 10
val_check_interval  = 1000
limit_val_batches   = 1
enable_progress_bar = true

trainer_accelerator = "gpu"
trainer_strategy    = "ddp"
trainer_devices     = 1
trainer_num_nodes   = 1
trainer_precision   = "16-mixed"

diagnostic_level = "standard"

# -- Environment settings ----------------------------------------------------------------------
[environment]
    max_steps         = 300
    observation_dim   = 45
    action_count      = 5
    use_start_channel = true
# -- Model settings -------------------------------------------------------------------------------
[model]
    observation_dim = 45
    action_count    = 5
    enable_sensory_recall = true

    # Current schema says int, but legacy TEM semantics strongly suggest this should
    # be a list of frequencies. This value only makes the TOML match the current
    # field name, not the intended legacy behavior.
    f_initial = [0.99, 0.3, 0.09, 0.5, 0.4]

[model.autoencoder]
    encode_mode = "two_hot"
    decode_mode = "mlp"

[model.hpc]
    shape         = [100, 100, 80, 60, 60]
    common_memory = false
    do_sample     = false

[model.hpc.query_policy]
    kind = "anchor"


[model.lec]
    feature_dim = 10
    clamp_min   = -1.0
    clamp_max   = 1.0

[model.projection_lec]
    mode      = "tiling"
    init      = "identity"
    learnable = false

[model.mec]
    grid_shape = [30, 24, 18, 24, 18]
    do_sample  = false
    sigma_init = 0.5
    clamp_min  = -1.0
    clamp_max  = 1.0

[model.projection_mec]
    mode      = "low_rank"
    init      = "identity"
    learnable = false
    rank      = [10, 10, 8, 6, 6]

# -- Optimizer and scheduler settings -------------------------------------------------------
[optimizer]
    lr           = 1e-4
    weight_decay = 1e-2
    betas        = [0.9, 0.98]

[scheduler]
    warmup_steps = 1000
    min_ratio    = 0.01

[runtime.memory]
    eta           = 0.5
    eta_it        = 16000
    hebbian_decay = 0.9999
    lambda_it     = 200

[runtime.uncertainty]
    p2g_sig_half_it  = 400
    p2g_sig_scale_it = 200
    offset_min       = 0.0
    offset_max       = 10000.0

# -- Loss settings --------------------------------------------------------------------------------
[loss]
    observation_loss  = "softmax_cross_entropy"
    c_obs             = 1.0
    c_grid            = 1.0
    c_place           = 1.0
    c_grid_reg        = 0.01
    c_place_reg       = 0.02
    grid_reg_norm     = "l2"
    place_reg_norm    = "l1"

# -- Controller settings --------------------------------------------------------------------------
[controller]
    max_steps = 20
[controller.policy]
    kind = "random_walk"
    seed = 42


# -- Logging settings --------------------------------------------------------------------------------
[logger]
    save_dir  = "logs"
    name      = "tem-dungeons"
    log_graph = false
    prefix    = ""

[checkpoint]
    every_n_epochs          = 1
    save_on_train_epoch_end = false
    save_last               = true


# -- Figures & diagnostics ------------------------------------------------------------------------
[figures]
    enabled = true
    split = "validate"
    figures = [
        # "lec_summary",
        "mec_summary",
        "hpc_summary",
        "lec_pipeline",
        "mec_cells",
        "hpc_cells",
    ]
    save_pdf = true
    log_tensorboard = true
    env_idx = 0
    freq_idx = 0
