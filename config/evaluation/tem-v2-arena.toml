# Evaluation executor config — TEM v2 on Arena.
# Derived from config/training/tem-v2-default-vram8gib.toml.
# All training orchestration stripped.  Dynamics schedules preserved.

model_config_path = "config/models/tem-v2-base.toml"

[adapter]
    observation_dim = 45
    action_count    = 5

[adapter.encoder]
    kind   = "two_hot"
    layout = "replicated"

[adapter.decoder]
    kind            = "single_scale"
    prediction_freq = 0

[controller]
    # window_size omitted — controller sees entire history.

[objective]
    observation_loss = "softmax_cross_entropy"
    c_obs            = 1.0
    c_grid           = 1.0
    c_place          = 1.0
    c_grid_reg       = 0.01
    c_place_reg      = 0.02
    grid_reg_norm    = "l2"
    place_reg_norm   = "l1"
    temp_it          = 2000
    p2g_use_it       = 0.0
    p2g_scale        = 200.0
    g_reg_it         = 40000000
    p_reg_it         = 4000

[runtime]
    kind = "fixed"

[runtime.memory]
    eta           = 0.5
    eta_it        = 16000
    hebbian_decay = 0.9999
    lambda_it     = 200

[runtime.uncertainty]
    p2g_sig_half_it  = 400
    p2g_sig_scale_it = 200
    offset_min       = 0.0
    offset_max       = 10000.0

[runtime.sequence]
    tbptt_steps = 75

[runtime.validation]
    hard_max_rollout_steps = 6000
    seed = 42
