experiment_id = "tem-v2-arena"

# Evaluation executor config — TEM v2 on Arena.
# Derived from config/training/tem-v2-arena-vram8gib.toml.
# All training orchestration stripped.  Dynamics schedules preserved.
#
# Nested structure matches Pydantic field names in
# ArenaTEMV2EvaluationExperimentConfig.

[model]
    model_config_path = "config/models/tem-v2-base.toml"

[model.components.adapter]
    observation_dim = 45
    action_count    = 5

[model.components.adapter.encoder]
    kind   = "two_hot"
    layout = "replicated"

[model.components.adapter.decoder]
    kind            = "single_scale"
    prediction_freq = 0

[model.components.controller]
    # window_size omitted — controller sees entire history.

[model.components.objective]
    observation_loss = "softmax_cross_entropy"
    c_obs            = 1.0
    c_grid           = 1.0
    c_place          = 1.0
    c_grid_reg       = 0.01
    c_place_reg      = 0.02
    grid_reg_norm    = "l2"
    place_reg_norm   = "l1"
    temp_it          = 2000
    p2g_use_it       = 0.0
    p2g_scale        = 200.0
    g_reg_it         = 40000000
    p_reg_it         = 4000

[execution]
    kind = "fixed"

[execution.memory]
    eta           = 0.5
    eta_it        = 16000
    hebbian_decay = 0.9999
    lambda_it     = 200

[execution.uncertainty]
    p2g_sig_half_it  = 400
    p2g_sig_scale_it = 200
    offset_min       = 0.0
    offset_max       = 10000.0

[execution.sequence]
    tbptt_steps = 75

[execution.validation]
    hard_max_rollout_steps = 6000

[provider]
    ref = "ehc_sn.tasks.arena.providers.ArenaReplayProvider"
    batch_size = 1
    [provider.settings]
        dataset_path = "data/processed/arena/default/v1"
        split = "val"
        n_cases = 4

[regime]
    id = "arena_diagnostic"
    kind = "diagnostic"

[capture]
    profile = "full_diagnostic"
