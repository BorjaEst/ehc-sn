# Evaluation executor config — HRM v2 on SeqMaze.
# Derived from config/training/hrm-v2-seqmaze-vram8gib.toml.
# Nested structure matches Pydantic field names in
# SeqMazeHRMV2EvaluationExperimentConfig.

experiment_id = "hrm-v2-seqmaze"

[model]
    model_config_path = "config/models/hrm-v2-base.toml"

[model.components.adapter]
    n_max         = 45
    t_max         = 16
    k_max         = 4
    edge_encoding = "successor_index_embedding"
    hidden_size   = 128

[model.components.controller]

[model.components.objective]
    token_loss      = "stablemax_cross_entropy"
    gamma           = 0.99
    c_state_value   = 0.5
    c_q_value       = 0.5

[execution]
    halt_action     = 0
    episode_horizon = 16

[execution.validation]
    max_rollout_steps = 16

[provider]
    ref = "ehc_sn.tasks.seqmaze.providers.SeqMazeReplayProvider"
    batch_size = 1
    [provider.settings]
        dataset_path = "data/processed/seqmaze/default/v1"
        split = "val"
        n_cases = 4

[regime]
    id = "seqmaze_diagnostic"
    kind = "diagnostic"

[capture]
    profile = "full_diagnostic"
