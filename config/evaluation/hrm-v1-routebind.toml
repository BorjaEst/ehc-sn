# Evaluation executor config — HRM v1 on Routebind.
# Nested structure matches Pydantic field names in
# RoutebindHRMV1EvaluationExperimentConfig.

experiment_id = "hrm-v1-routebind"

[model]
    model_config_path = "config/models/hrm-v1-base.toml"

[model.components.adapter]
    encoder_kind     = "rope"
    num_cell_types   = 4
    num_observations = 45
    grid_height      = 30
    grid_width       = 30

[model.components.controller]
    max_halt_steps    = 16
    exploration_prob  = 0.0

[model.components.task_evaluator]
    trajectory_loss   = "mse"
    acceptable_error  = 0.1
    halt_temperature  = 0.1

[execution.validation]
    max_rollout_steps = 16

[provider]
    ref = "ehc_sn.tasks.routebind.providers.RoutebindReplayProvider"
    [provider.settings]
        dataset_path = "data/processed/routebind/default/v1"
        split = "val"

[regime]
    id = "routebind_diagnostic"
    kind = "diagnostic"

[capture]
    profile = "metrics_only"
