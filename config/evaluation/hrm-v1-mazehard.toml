# Evaluation executor config — HRM v1 on MazeHard.
# Derived from config/training/hrm-v1-mazehard-vram8gib.toml.
# Key eval override: exploration_prob = 0.0 (deterministic).
# Nested structure matches Pydantic field names in
# MazeHardHRMV1EvaluationExperimentConfig.

experiment_id = "hrm-v1-mazehard"

[model]
    model_config_path = "config/models/hrm-v1-base.toml"

[model.components.adapter]
    encoder_kind = "rope"
    vocab_size   = 6

[model.components.controller]
    max_halt_steps    = 16
    exploration_prob  = 0.0

[model.components.task_evaluator]
    token_loss = "stablemax_cross_entropy"

[execution.validation]
    max_rollout_steps = 16

[provider]
    ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayProvider"
    [provider.settings]
        dataset_path = "data/processed/mazehard/default/v1"
        split = "val"
        n_cases = 4

[regime]
    id = "mazehard_diagnostic"
    kind = "diagnostic"

[capture]
    profile = "full_diagnostic"