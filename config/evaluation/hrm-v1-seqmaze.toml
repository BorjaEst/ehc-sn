# Evaluation executor config — HRM v1 on SeqMaze.
# Derived from config/training/hrm-v1-seqmaze-vram8gib.toml.
# Nested structure matches Pydantic field names in
# SeqMazeHRMV1EvaluationExperimentConfig.

experiment_id = "hrm-v1-seqmaze"

[model]
    model_config_path = "config/models/hrm-v1-base.toml"

[model.components.adapter]
    n_max         = 45
    t_max         = 16
    k_max         = 4
    edge_encoding = "successor_node_pool"
    hidden_size   = 128

[model.components.controller]
    max_halt_steps    = 16
    exploration_prob  = 0.0

[model.components.task_evaluator]
    task_modality = "token"
    token_loss    = "softmax_cross_entropy"

[execution.validation]
    max_rollout_steps = 16

[provider]
    ref = "ehc_sn.tasks.seqmaze.providers.SeqMazeReplayProvider"
    [provider.settings]
        dataset_path = "data/processed/seqmaze/default/v1"
        split = "val"

[regime]
    id = "seqmaze_diagnostic"
    kind = "diagnostic"

[capture]
    profile = "metrics_only"
