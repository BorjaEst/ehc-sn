# =============================================================================
# Goaltrace × HRM-v1 recipe definition.
# =============================================================================

schema_version = 1
alias = "goaltrace-hrm-v1"

task = "goaltrace"
model_family = "hrm-v1"

primary_metric = "field_mse"
required_capabilities = []

[cases]
split = "test"
count = 128
seed = 0

[cases.dataset]
uri = "data/processed/goaltrace/default/v1"

[evaluation]
# GoaltraceHRMV1EvaluationOptions is empty — no pair-specific options.

[capture]
profile = "diagnostic"
max_cases = 16

[inspection]
enabled = true
figures = [
    "task_overview_goaltrace",
    "prediction_reasoning_goaltrace",
]
formats = ["png"]
