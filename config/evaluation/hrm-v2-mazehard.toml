# Evaluation executor config — HRM v2 on MazeHard.
# Derived from config/training/hrm-v2-mazehard-vram8gib.toml.
# Nested structure matches Pydantic field names in
# MazeHardHRMV2EvaluationExperimentConfig.

experiment_id = "hrm-v2-mazehard"

[model]
    model_config_path = "config/models/hrm-v2-base.toml"

[model.components.adapter]
    encoder_kind = "rope"
    vocab_size   = 6

[model.components.controller]

[model.components.objective]
    token_loss      = "stablemax_cross_entropy"
    c_state_value   = 0.5
    c_q_value       = 0.5

[execution]
    halt_action     = 0
    episode_horizon = 16

[provider]
    ref = "ehc_sn.tasks.mazehard.providers.MazeHardReplayProvider"
    [provider.settings]
        dataset_path = "data/processed/mazehard/default/v1"
        split = "val"
        n_cases = 4

[regime]
    id = "mazehard_diagnostic"
    kind = "diagnostic"

[capture]
    profile = "full_diagnostic"
