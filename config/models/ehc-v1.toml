# =============================================================================
# EHC v1 Architecture
# =============================================================================

observation_dim       = 45
action_count          = 5
internal_action_count = 4
external_context_dim  = 1
sequence_vocab_size   = 6
sequence_summary_layers = 1
pfc_hpc_cortical_cue_summary_layers = 1
enable_sensory_recall = true
f_initial             = [0.99, 0.3, 0.09, 0.5, 0.4]

[autoencoder]
    encode_mode = "two_hot"
    decode_mode = "mlp"

[hpc]
    shape         = [100, 100, 80, 60, 60]
    common_memory = false
    do_sample     = false

[hpc.read]
    beta            = 1.0
    empty_retrieval = "query"
    beta_scaling    = "log_memory_count"
    iterations      = 1
    recurrence      = "none"

[hpc.write]
    policy             = "append_if_novel"
    novelty_similarity = "cosine"
    novelty_threshold  = 0.95
    write_bank         = "default"

[hpc.store]
    memory_capacity = 512
    bank_names      = ["c"]

[lec]
    feature_dim = 10
    clamp_min   = -1.0
    clamp_max   = 1.0

[lec_to_hpc_x_projection]
    mode      = "tiling"
    init      = "identity"
    learnable = false

[mec]
    grid_shape = [30, 24, 18, 24, 18]
    do_sample  = false
    sigma_init = 0.5
    clamp_min  = -1.0
    clamp_max  = 1.0

[mec_to_hpc_g_projection]
    mode      = "low_rank"
    init      = "identity"
    learnable = false
    rank      = [10, 10, 8, 6, 6]

[pfc]
    seq_length             = 36
    value_head.hidden_size = 256
    value_head.n_actions   = 4
    value_head.pool_mode   = "first"
    value_head.pool_index  = 0
    value_head.init_bias   = -5.0
    cortex.embedding_dim   = 256
    cortex.num_heads       = 8
    cortex.pos_encodings   = "rope"
    cortex.rope_theta      = 10000.0
    layers_h               = 4
    cycles_h               = 2
    layers_l               = 4
    cycles_l               = 2

[str]
    n_features = 256
    n_actions  = 4
    hidden_size = 64