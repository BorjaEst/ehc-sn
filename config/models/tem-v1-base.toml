# =============================================================================
# Metadata (comments only)
# class: model
# id: tem-v1-base
# role: architecture-only model defaults; runtime budgets are owned by training configs
# =============================================================================

transition_action_count = 5
f_initial               = [0.99, 0.30, 0.09, 0.03, 0.01]
enable_sensory_recall   = true

[hpc]
    shape         = [100, 100, 80, 60, 60]
    common_memory = false
    do_sample     = false

[hpc.read]
    kappa = 0.8

[hpc.write]
    clamp_min = -1.0
    clamp_max = 1.0

[lec]
    feature_dim = 10
    clamp_min   = -1.0
    clamp_max   = 1.0

[projections.lec_to_hpc]
    mode      = "tiling"
    init      = "identity"
    learnable = false

[mec]
    grid_shape = [30, 30, 24, 18, 18]
    do_sample  = false
    sigma_init = 0.5
    clamp_min  = -1.0
    clamp_max  = 1.0

[projections.mec_to_hpc]
    mode      = "low_rank"
    init      = "identity"
    learnable = false
    rank      = [10, 10, 8, 6, 6]
