site_name: ehp-sn
site_description: Entorhinal-Hippocampal Circuit Spatial Navigation library
site_author: Borja Esteban Sanchis
docs_dir: docs

theme:
  name: mkdocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../src

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Run Cookbook: run-cookbook.md
  - Concepts:
      - Architecture: architecture.md
      - EHP Model: models/ehp.md
      - Model Family Selection: model-family-selection.md
      - Training Regimes:
          - Overview: regimes/_index.md
          - Supervised ACT: regimes/supervised-act.md
          - Supervised Q-halting: regimes/supervised-q-halting.md
          - Variational Replay: regimes/variational-replay.md
  - Usage:
      - Data and Paths: data-and-paths.md
      - Data Generation: data-generation.md
      - Substrates:
          - Overview: substrates/_index.md
          - maze-nd: substrates/maze-nd.md
          - dungeongen: substrates/dungeongen.md
          - dagflow: substrates/dagflow.md
          - openfield: substrates/openfield.md
      - Training: training.md
      - Benchmarks: benchmarks.md
      - Evaluation: evaluation.md
      - Figures: figures.md
      - Checkpoints and Artifacts: checkpoints-and-artifacts.md
  - Configuration:
      - Configuration: configuration.md
      - Environment Variables: environment-variables.md
  - CLI:
      - Overview: cli/index.md
      - Data Generation: cli/data.md
      - Tasks Generation: cli/tasks.md
      - Train Models: cli/train.md
      - Evaluate Models: cli/evaluate.md
      - Report Generation: cli/report.md
  - Developers:
      - Development: development.md
      - Specs And Governance: specs-and-governance.md
      - Legacy Context: legacy-context.md
  - Theory:
  - Design:
      - Index: design/_index.md
      - Contracts: design/contracts.md
      - Data: design/data.md
      - Analysis: design/analysis.md
      - Adapters: design/adapters.md
      - Controllers: design/controllers.md
      - Logging: design/logging.md
      - Loss: design/loss.md
      - Metrics: design/metrics.md
      - Objectives: design/objectives.md
      - Rollouts: design/rollouts.md
      - Training: design/training.md
      - Traces: design/traces.md
      - Utilities: design/utils.md
      - EHP Theory Foundations: ehp-theory-foundations.md
      - Memory-Mediated Reasoning: memory-mediated-reasoning.md
      - Notation Map: notation-map.md
      - PFC Working Memory Theory: pfc-working-memory-theory.md

markdown_extensions:
  - tables
  - toc:
      permalink: true
