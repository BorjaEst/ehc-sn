strict = true

[required]
    files = [
        "spec/spec-manifest.toml",
        "spec/spec-architecture.md",
        "spec/spec-requirements.md",
        "spec/spec-standards.md",
    ]

[collection]
    default_scope = "required"

    [collection.topic_files]
        data = ["spec/spec-data-contracts.md"]
        benchmarks = ["spec/spec-benchmark-suite.md"]
        configuration = ["spec/spec-configuration-patterns.md"]
        interfaces = ["spec/spec-model-interfaces.md", "spec/spec-controller-runtime-contracts.md"]
        process = ["spec/spec-process-spec-maintenance.md"]

[canonical_paths]
    plans_root        = ".copilot-tracking/plans"
    plan_details_root = ".copilot-tracking/details"
    plan_changes_root = ".copilot-tracking/changes"
    docs_root         = "docs"

# Precedence: earlier entries override later ones when specs conflict.
# This is the single source of truth for precedence; other specs reference
# this table rather than duplicating it.
[precedence]
    order = [
        "spec/spec-manifest.toml",
        "spec/spec-architecture.md",
        "spec/spec-requirements.md",
        "spec/spec-standards.md",
    ]
